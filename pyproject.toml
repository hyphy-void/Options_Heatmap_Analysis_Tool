[project]
name = "options-heatmap-analysis-tool"
version = "0.1.0"
description = "Flask options heatmap app backed by Finnhub"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "flask==2.3.3",
    "matplotlib==3.7.1",
    "numpy==1.24.3",
    "pandas==2.1.1",
    "plotly==5.17.0",
    "seaborn==0.12.2",
    "Werkzeug==2.3.7",
    "finnhub-python==2.4.25",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
