name: Validate requirements mirror

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  requirements-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Export runtime requirements mirror
        run: |
          tmp_requirements="$(mktemp)"
          uv export --frozen --no-dev --format requirements.txt --no-hashes --no-annotate --output-file "$tmp_requirements"
          diff -u <(tail -n +3 requirements.txt) <(tail -n +3 "$tmp_requirements")

      - name: Explain sync failure
        if: failure()
        run: |
          echo "requirements.txt is out of sync with pyproject.toml / uv.lock."
          echo "Regenerate it with:"
          echo "uv export --frozen --no-dev --format requirements.txt --no-hashes --no-annotate --output-file requirements.txt"
          exit 1
